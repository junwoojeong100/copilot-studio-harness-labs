schema: copilot-studio-blueprint/v1
kind: github-copilot-harness-workflow

name: Execute GitHub Issue Triage
description: 에이전트가 제안한 이슈 변경을 검증하고 필요한 승인을 받은 뒤 GitHub와 감사 로그에 적용합니다.
harness: github-copilot

trigger:
  type: When an agent calls the flow
  inputs:
    repository: { type: string, required: true }
    issueNumber: { type: number, required: true }
    dryRun: { type: boolean, required: true, default: true }
    type: { type: string, required: true }
    priority: { type: string, required: true }
    team: { type: string, required: true }
    confidence: { type: number, required: true }
    labelsToAdd:
      type: array
      items: { type: string }
    proposedComment: { type: string, required: false, default: "" }
    duplicateCandidates:
      type: array
      required: false
      items: { type: object }

nodes:
  - id: validate-input
    type: Condition
    expression: >-
      @and(
        contains(createArray('bug','feature','documentation','question','security'), triggerBody()?['type']),
        contains(createArray('P0','P1','P2','P3'), triggerBody()?['priority']),
        contains(createArray('platform','frontend','backend','data','docs','security','needs-triage'), triggerBody()?['team']),
        greaterOrEquals(float(triggerBody()?['confidence']), 0),
        lessOrEquals(float(triggerBody()?['confidence']), 1)
      )
    ifFalse:
      action: Terminate
      status: Failed
      message: Invalid triage proposal.

  - id: get-current-issue
    type: GitHub connector
    action: Get issue
    inputs:
      repository: "@{triggerBody()?['repository']}"
      issueNumber: "@{triggerBody()?['issueNumber']}"

  - id: list-repository-labels
    type: GitHub connector
    action: List labels
    inputs:
      repository: "@{triggerBody()?['repository']}"

  - id: filter-existing-labels
    type: Filter array
    from: "@{triggerBody()?['labelsToAdd']}"
    where: "@{contains(body('list-repository-labels'), item())}"

  - id: calculate-approval
    type: Compose
    inputs:
      required: >-
        @or(
          equals(triggerBody()?['type'], 'security'),
          equals(triggerBody()?['priority'], 'P0'),
          less(float(triggerBody()?['confidence']), 0.75),
          equals(triggerBody()?['team'], 'needs-triage')
        )

  - id: dry-run-branch
    type: Condition
    expression: "@equals(triggerBody()?['dryRun'], true)"
    ifTrue:
      next: write-dry-run-audit
    ifFalse:
      next: approval-branch

  - id: approval-branch
    type: Condition
    expression: "@equals(outputs('calculate-approval')?['required'], true)"
    ifTrue:
      next: request-approval
    ifFalse:
      next: apply-labels

  - id: request-approval
    type: Microsoft Teams Approvals
    action: Start and wait for an approval
    timeout: PT24H
    inputs:
      title: "GitHub triage approval: @{triggerBody()?['repository']}#@{triggerBody()?['issueNumber']}"
      details: >-
        Type: @{triggerBody()?['type']}
        Priority: @{triggerBody()?['priority']}
        Team: @{triggerBody()?['team']}
        Confidence: @{triggerBody()?['confidence']}
        Labels: @{join(body('filter-existing-labels'), ', ')}

  - id: approval-result
    type: Condition
    expression: "@equals(outputs('request-approval')?['outcome'], 'Approve')"
    ifTrue:
      next: apply-labels
    ifFalse:
      next: write-rejected-audit

  - id: apply-labels
    type: GitHub connector
    action: Add labels to issue
    retry:
      count: 1
      policy: exponential
    inputs:
      repository: "@{triggerBody()?['repository']}"
      issueNumber: "@{triggerBody()?['issueNumber']}"
      labels: "@{body('filter-existing-labels')}"

  - id: comment-branch
    type: Condition
    expression: "@not(empty(triggerBody()?['proposedComment']))"
    ifTrue:
      next: add-comment
    ifFalse:
      next: write-success-audit

  - id: add-comment
    type: GitHub connector
    action: Add issue comment
    retry:
      count: 1
      policy: exponential
    inputs:
      repository: "@{triggerBody()?['repository']}"
      issueNumber: "@{triggerBody()?['issueNumber']}"
      body: "@{triggerBody()?['proposedComment']}"

  - id: write-dry-run-audit
    type: SharePoint-or-Dataverse
    action: Create audit record
    inputs:
      outcome: DRY_RUN
      previousLabels: "@{body('get-current-issue')?['labels']}"
      proposedLabels: "@{body('filter-existing-labels')}"

  - id: write-rejected-audit
    type: SharePoint-or-Dataverse
    action: Create audit record
    inputs:
      outcome: APPROVAL_REJECTED_OR_TIMED_OUT
      previousLabels: "@{body('get-current-issue')?['labels']}"
      proposedLabels: "@{body('filter-existing-labels')}"
      approver: "@{outputs('request-approval')?['responder']}"

  - id: write-success-audit
    type: SharePoint-or-Dataverse
    action: Create audit record
    inputs:
      outcome: APPLIED
      previousLabels: "@{body('get-current-issue')?['labels']}"
      appliedLabels: "@{body('filter-existing-labels')}"
      approver: "@{outputs('request-approval')?['responder']}"

  - id: respond
    type: Respond to the agent
    outputs:
      status: DRY_RUN|APPLIED|REVIEW_REQUIRED|PARTIAL_FAILURE|FAILED
      appliedLabels: array
      commentAdded: boolean
      approvalRequired: boolean
      approvalOutcome: string
      auditId: string
      message: string

prohibitedActions:
  - close issue
  - delete issue
  - mark duplicate automatically
  - remove existing labels without explicit approval

errorHandling:
  partialFailure:
    recordAudit: true
    returnAppliedAndFailedOperationsSeparately: true
  terminalFailure:
    status: FAILED
    needsHumanReview: true

